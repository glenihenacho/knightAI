# Fly.io app config for the server-side detection worker.
#
# Deploy from the workspace root:
#
#   fly deploy --config infra/deploy/fly.worker.toml --dockerfile infra/docker/Dockerfile.worker
#
# Before the first deploy:
#   1. fly secrets set DATABASE_URL=... S3_ENDPOINT=... S3_BUCKET=...
#      S3_ACCESS_KEY_ID=... S3_SECRET_ACCESS_KEY=... -a surveillance-worker
#   2. Upload the model: node apps/worker/scripts/upload-model.mjs
#      (worker refuses to boot without models/yolox_nano.onnx in S3)
#
# The worker has no public surface; /metrics + /healthz stay on the private
# network. Capacity: one shard handles ~30 cameras at 5 fps CPU-only; add
# workers by raising WORKER_SHARDS on the API and running one app per shard.

app = "surveillance-worker"
primary_region = "iad"

[build]
  dockerfile = "../docker/Dockerfile.worker"

[deploy]
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  METRICS_PORT = "9100"
  WORKER_SHARD = "0"
  S3_FORCE_PATH_STYLE = "true"

# Detection must not scale to zero — it has to chew segments while nobody is
# watching the dashboard. No [http_service]: nothing public.
[[services]]
  internal_port = 9100
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
