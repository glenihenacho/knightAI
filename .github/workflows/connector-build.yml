name: Build connector installers

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: surveillance-platform

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-22.04
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: surveillance-platform/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: surveillance-platform/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: surveillance-platform/apps/connector-tauri/src-tauri

      - run: pnpm install --frozen-lockfile

      # pretauri:build fetches the platform FFmpeg sidecar into src-tauri/binaries/
      - run: pnpm --filter @surveillance/connector-tauri tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: connector-${{ matrix.label }}
          path: |
            surveillance-platform/apps/connector-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            surveillance-platform/apps/connector-tauri/src-tauri/target/release/bundle/msi/*.msi
            surveillance-platform/apps/connector-tauri/src-tauri/target/release/bundle/nsis/*.exe
            surveillance-platform/apps/connector-tauri/src-tauri/target/release/bundle/deb/*.deb
            surveillance-platform/apps/connector-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            surveillance-platform/apps/connector-tauri/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
