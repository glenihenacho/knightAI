[package]
name = "surveillance-connector"
version = "0.1.0"
description = "Surveillance Platform local connector"
edition = "2021"
rust-version = "1.77"

[lib]
name = "surveillance_connector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs", "io-util", "net"] }
anyhow = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
directories = "5.0"
url = "2.5"
tempfile = "3.13"

[features]
custom-protocol = ["tauri/custom-protocol"]
