services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: surveillance
      POSTGRES_USER: surveillance
      POSTGRES_PASSWORD: surveillance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveillance"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: surveillance
      MINIO_ROOT_PASSWORD: surveillance
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot init: creates the snapshot bucket if it doesn't exist, then exits.
  # Re-runs on every `docker compose up` and is a no-op when the bucket exists.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 surveillance surveillance &&
      mc mb --ignore-existing local/surveillance &&
      mc anonymous set download local/surveillance ||
      exit 0
      "

volumes:
  pgdata:
  miniodata:
